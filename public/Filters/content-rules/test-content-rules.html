<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Content rules tests</title>
    <link rel="stylesheet" href="../qunit/qunit.css">
    <link rel="stylesheet" href="../qunit/custom.css">
</head>

<body>
    <div id="subscribe-to-test-content-rules-filter" class="subscribe-link">
        <a href="test-content-rules.txt">Subscribe to test filter</a>
    </div>
    <div id="qunit"></div>
    <div id="qunit-fixture"></div>
    <script src="../qunit/qunit.js"></script>

    <!-- Hiding container from user's sight -->
    <style type="text/css">.container { position: absolute; top: -2500px; }</style>
    <div class="container">
        <style>
            .banner {
                width: 300px;
                height: 300px;
            }
        </style>

        <div id="case1" class="banner">
            <a class="banner-link">
            </a>
        </div>

        <div id="case2" class="banner">
            <a class="banner-link">
                test-case-2-content
            </a>
        </div>

        <div id="case3" class="test-case-3-class">
            <a class="banner-link">
            </a>
        </div>

        <div id="case4" class="banner">
            <a class="banner-link">
                tratata teasernet\n \ntararar
            </a>
        </div>

        <div id="case5" class="banner">
            <a class="banner-link">
            </a>
        </div>

        <div id="case6" class="banner" custom_attr="myattr">
            <a class="banner-link">
            </a>
        </div>

        <div id="case7">
            <span id="case7-1">test-case-7-Content</span>
            <div id="case7-2">test-case-7-Content</div>
        </div>

        <div id="case8">
            <h1 id="case8-1"></h1>
            <h2 id="case8-2"></h2>
            <h3 id="case8-3"></h3>
        </div>

        <div id="case9">
            <span id="case9-1" title="Anything"></span>
            <div id="case9-2"></div>
            <div id="case9-3"></div>
            <span id="case9-4" title="Substring"></span>
            <div id="case9-5"></div>
            <div id="case9-6"></div>
        </div>

        <div id="case10">
            <div id="case10-1">
                parent to not delete
                <span id="case10-2">child to delete</span>
                <span id="case10-3">child to not delete</span>
            </div>
            <div id="case10-4">
                parent to delete
                <span id="case10-5">child to delete</span>
                <span id="case10-6">child to not delete</span>
            </div>
        </div>

        <!--
            Cases 11-13: script elements are targets of HTML filtering rules
            with quoted / regexp :contains() arguments; the QUnit tests check
            whether each element is still present after the page load.
        -->

        <!-- Case 11: removed by $$script:contains("(function(g,b,a,c,e,d)") if wrapping quotes are stripped -->
        <script id="case11">(function(g,b,a,c,e,d){ return true; })();</script>
        <!-- Case 11 control: does not contain the needle, must survive -->
        <script id="case11-control">window.case11Control = true;</script>

        <!-- Case 12: removed by $$script:contains("/html-filtering-quoted-regex-\d+/") if the unquoted argument is a regexp -->
        <script id="case12-regexp">window.case12a = 'html-filtering-quoted-regex-123';</script>
        <!-- Case 12: survives if the unquoted argument is a regexp (its raw text matches only the literal reading) -->
        <script id="case12-literal">window.case12b = '/html-filtering-quoted-regex-\d+/';</script>
        <!-- Case 12 control: does not contain the needle, must survive -->
        <script id="case12-control">window.case12Control = true;</script>

        <!-- Case 13: removed by the unquoted regexp $$script:contains(/html-filtering-plain-regex-\d+/) -->
        <script id="case13">window.case13 = 'html-filtering-plain-regex-456';</script>
        <!-- Case 13 control: does not contain the needle, must survive -->
        <script id="case13-control">window.case13Control = true;</script>
    </div>

    <script type="module" src="test-content-rules.js"></script>
</body>
</html>
