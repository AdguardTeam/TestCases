<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>HTML filtering rules tests</title>
    <link rel="stylesheet" href="../qunit/qunit.css">
    <link rel="stylesheet" href="../qunit/custom.css">
</head>

<body>
    <div id="subscribe-to-test-html-filtering-rules-filter" class="subscribe-link">
        <a href="test-html-filtering-rules.txt">Subscribe to test filter</a>
    </div>
    <div id="qunit"></div>
    <div id="qunit-fixture"></div>

    <!--
        HTML filtering rule targets: each script below is a candidate for
        removal by a $$ rule; the QUnit test checks whether the element
        is still present in the DOM after the page load.
    -->

    <!-- Case 1: removed by $$script:contains("(function(g,b,a,c,e,d)") if wrapping quotes are stripped -->
    <script id="case1-target">(function(g,b,a,c,e,d){ return true; })();</script>
    <!-- Case 1 control: does not contain the needle, must survive -->
    <script id="case1-control">window.case1Control = true;</script>

    <!-- Case 2: removed by $$script:contains("/html-filtering-quoted-regex-\d+/") if the unquoted argument is a regexp -->
    <script id="case2-regexp-target">window.case2a = 'html-filtering-quoted-regex-123';</script>
    <!-- Case 2: survives if the unquoted argument is a regexp (its raw text matches only the literal reading) -->
    <script id="case2-literal-target">window.case2b = '/html-filtering-quoted-regex-\d+/';</script>
    <!-- Case 2 control: does not contain the needle, must survive -->
    <script id="case2-control">window.case2Control = true;</script>

    <!-- Case 3: removed by the unquoted regexp $$script:contains(/html-filtering-plain-regex-\d+/) -->
    <script id="case3-target">window.case3 = 'html-filtering-plain-regex-456';</script>
    <!-- Case 3 control: does not contain the needle, must survive -->
    <script id="case3-control">window.case3Control = true;</script>

    <script src="../qunit/qunit.js"></script>

    <script type="module" src="test-html-filtering-rules.js"></script>
</body>

</html>
